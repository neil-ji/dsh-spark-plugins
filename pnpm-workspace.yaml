packages:
  - packages/*

overrides:
  # pnpm 11.11 的通配 override（'@deepseek-ai/dsh-*'）实测不生效：^0.1.0-rc.6 仍解析到 npm 最新 rc.7。
  # 只能逐包精确钉版，且与全局 dsh（0.1.0-rc.6）保持一致，避免 rc.6/rc.7 双版本并存导致类型分裂。
  '@deepseek-ai/dsh-agent': 0.1.0-rc.6
  '@deepseek-ai/dsh-agent-default-model': 0.1.0-rc.6
  '@deepseek-ai/dsh-agent-presets': 0.1.0-rc.6
