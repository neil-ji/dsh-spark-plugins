<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dsh dev control</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#161a21; --line:#252b36; --fg:#e6e9ef; --dim:#8b93a3; --accent:#5b9cff; --ok:#4ec9a0; --warn:#e5b567; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { display:flex; gap:16px; align-items:baseline; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { font-size:14px; margin:0; font-weight:600; }
  header .meta { color:var(--dim); font-size:12px; }
  header .meta b { color:var(--fg); font-weight:500; }
  main { display:grid; grid-template-columns: 320px 1fr; gap:16px; padding:16px; align-items:start; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 10px; font-weight:600; }
  button { width:100%; text-align:left; background:#1d2330; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:6px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button[disabled] { opacity:.5; cursor:progress; }
  button .kind { float:right; font-size:11px; color:var(--warn); }
  button .kind.safe { color:var(--ok); }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .row label { flex:0 0 110px; color:var(--dim); font-size:12px; }
  .row input { flex:1; background:#0c0f14; border:1px solid var(--line); border-radius:5px; color:var(--fg); padding:5px 7px; font:inherit; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  td.state-2 { color:var(--ok); }
  td.state-1, td.state-0 { color:var(--warn); }
  td.state-3, td.state-4 { color:#ff6b6b; }
  pre { margin:0; padding:8px; background:#0c0f14; border:1px solid var(--line); border-radius:6px; overflow:auto; max-height:220px; font-size:11.5px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .pill { display:inline-block; padding:1px 6px; border-radius:99px; border:1px solid var(--line); font-size:11px; color:var(--dim); }
  .pill.on { color:var(--ok); border-color:#2b5f4d; }
  .muted { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>dsh dev control</h1>
  <span class="meta" id="meta">连接中…</span>
</header>
<main>
  <div>
    <section style="margin-bottom:16px">
      <h2>场景触发</h2>
      <div id="scenarios" class="muted">加载中…</div>
    </section>
    <section>
      <h2>最近结果</h2>
      <pre id="result">（无）</pre>
    </section>
  </div>
  <div>
    <section style="margin-bottom:16px">
      <h2>服务</h2>
      <div id="services" class="muted">…</div>
    </section>
    <section style="margin-bottom:16px">
      <h2>Loader 条目</h2>
      <div style="max-height:260px; overflow:auto"><table id="entries"><thead><tr><th>id</th><th>specifier</th><th>state</th></tr></thead><tbody></tbody></table></div>
    </section>
    <div class="grid2">
      <section>
        <h2>客户端 boot 图</h2>
        <pre id="graph">…</pre>
      </section>
      <section>
        <h2>HMR 事件</h2>
        <pre id="events">…</pre>
      </section>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id)
let scenarioDefs = []

async function api(path, init) {
  const res = await fetch(path, init)
  const text = await res.text()
  let data
  try { data = JSON.parse(text) } catch { data = { raw: text } }
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status))
  return data
}

function renderScenarios() {
  const host = $('scenarios')
  host.innerHTML = ''
  host.className = ''
  for (const scenario of scenarioDefs) {
    const wrap = document.createElement('div')
    const button = document.createElement('button')
    button.innerHTML = scenario.title + '<span class="kind ' + scenario.kind + '">' + scenario.kind + '</span>'
    if (scenario.description) button.title = scenario.description
    const params = document.createElement('div')
    params.style.display = 'none'
    params.style.margin = '0 0 10px 0'
    for (const param of scenario.params || []) {
      const row = document.createElement('div')
      row.className = 'row'
      row.innerHTML = '<label>' + param.name + '</label><input value="' + String(param.default ?? '') + '" />'
      params.appendChild(row)
    }
    button.addEventListener('click', async () => {
      const args = {}
      for (const row of params.querySelectorAll('.row')) {
        args[row.querySelector('label').textContent] = row.querySelector('input').value
      }
      if (Object.keys(args).length > 0) params.style.display = params.style.display === 'none' ? 'block' : 'none'
      if (params.style.display === 'block' && Object.keys(args).length > 0 && !button.dataset.armed) {
        button.dataset.armed = '1'
        button.querySelector('.kind').textContent = '再点一次执行'
        return
      }
      button.dataset.armed = ''
      button.disabled = true
      $('result').textContent = '执行中… ' + scenario.id
      try {
        const out = await api('/__dev/scenario/' + scenario.id, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(args),
        })
        $('result').textContent = JSON.stringify(out, null, 2)
      } catch (error) {
        $('result').textContent = '✗ ' + String(error.message || error)
      } finally {
        button.disabled = false
        const kind = button.querySelector('.kind')
        if (kind) kind.textContent = scenario.kind
      }
    })
    wrap.appendChild(button)
    wrap.appendChild(params)
    host.appendChild(wrap)
  }
}

function renderProbe(probe) {
  $('meta').innerHTML = 'DSH_HOME <b>' + (probe.home || '?') + '</b> · cwd <b>' + probe.cwd + '</b>'
  $('services').innerHTML = Object.entries(probe.services)
    .map(([name, on]) => '<span class="pill ' + (on ? 'on' : '') + '">' + name + '</span>')
    .join(' ')
  const body = $('entries').querySelector('tbody')
  body.innerHTML = probe.entries.map((entry) => {
    const state = entry.fiberState === null ? '?' : entry.fiberState
    return '<tr><td>' + (entry.id ?? '') + '</td><td class="muted">' + (entry.name ?? '') +
      '</td><td class="state-' + state + '">' + state + '</td></tr>'
  }).join('')
  $('graph').textContent = JSON.stringify(probe.clientGraph, null, 1)
  const events = probe.events
  $('events').textContent = [
    'graph: ' + events.graph.map((e) => e.rev).join(', '),
    'rebuilt: ' + events.rebuilt.map((e) => e.id + '@' + e.rev).join(', '),
    'hmr/reload: ' + events.hmrReload.length + ' 次',
    'hmr/change: ' + events.hmrChange.map((e) => e.url.split('/').slice(-1)[0]).join(', '),
  ].join('\n')
}

async function tick() {
  try {
    const probe = await api('/__dev/probe')
    renderProbe(probe)
  } catch (error) {
    $('meta').textContent = '✗ ' + String(error.message || error)
  }
}

api('/__dev/scenarios').then((data) => {
  scenarioDefs = data.scenarios || []
  renderScenarios()
}).catch((error) => { $('scenarios').textContent = '✗ ' + String(error.message || error) })

tick()
setInterval(tick, 1500)
</script>
</body>
</html>
