# dsh-spark-finance bundle patch: appends the finance host service and its settings
# section over the dsh-web-app layer. Rows are addressed by id — the profile's
# own cordis.patch.yml can override the finance config without editing this
# file. No API key is ever written here; credentials resolve at runtime from
# the apiKeyEnv reference.
- insert:
    - id: finance
      name: dsh-spark-finance
      config:
        # No top-level currency: each `providers[].currency` carries its own
        # account currency, and hostMeta defaults (deepseek-official = CNY)
        # seed any provider the user adds through the dashboard.
        balance:
          baseURL: https://api.deepseek.com
          apiKeyEnv: DEEPSEEK_API_KEY
          timeoutMs: 10000
        # Flat 24/7 fallback for models without a `prices` entry and whose
        # provider has no `providerDefaults` rate (deepseek-chat era estimate).
        # Maintain from official pricing docs.
        defaultPrice:
          inputMicrosPerMtok: 2000000
          cacheReadMicrosPerMtok: 500000
          cacheWriteMicrosPerMtok: 2000000
          outputMicrosPerMtok: 8000000
        # Per-provider flat fallback rates, keyed by provider (the part of the
        # model key before the first '/'). Any model with no per-model `prices`
        # entry under that provider prices at this rate instead of the DeepSeek-
        # oriented global defaultPrice. This is how non-DeepSeek providers get a
        # sensible cost estimate without enumerating every model. Amounts are
        # integer micros per million tokens (CNY * 1e6); estimates converted at
        # ~7.2 CNY/USD from published USD list prices (reviewed 2025), maintain
        # from official pricing docs.
        providerDefaults:
          openai:
            inputMicrosPerMtok: 3600000
            cacheReadMicrosPerMtok: 900000
            outputMicrosPerMtok: 14400000
          anthropic:
            inputMicrosPerMtok: 18000000
            cacheReadMicrosPerMtok: 1800000
            outputMicrosPerMtok: 90000000
          google:
            inputMicrosPerMtok: 4320000
            cacheReadMicrosPerMtok: 1080000
            outputMicrosPerMtok: 28800000
        # Official DeepSeek V4 price table (api.deepseek.com, reviewed 2026-08).
        # Each model carries an era history: the launch flat price, then the
        # peak/off-peak schedule effective 2026-08-17 00:00 Beijing time.
        # Peak windows are weekdays (Mon-Fri) 9:00-12:00 / 14:00-18:00
        # Beijing time (peakDays 1-5); weekends are entirely off-peak.
        # Off-peak = half of peak. deepseek-v4-flash-vision-exp prices
        # identically to deepseek-v4-flash.
        # Amounts are integer micros per million tokens (CNY * 1e6).
        prices:
        # Non-DeepSeek pricing is synced from a community-maintained table so
        # nobody hand-maintains it: `pnpm finance:sync-prices` refills everything
        # between the two markers below from models.dev (USD list prices x --fx).
        # Do not hand-edit inside the markers; add one-off overrides ABOVE them,
        # or pin a model via the settings card's user layer instead.
