# dsh-script bundle patch.
# 插入宿主行：注册 ctx.script 服务 + 四个 agent 工具 + /scripts HTTP API + script/events 流。
# 外加 client 行：`dsh-script-client` 是纯 UI 插件（dsh.client 声明 web 半边），
# 必须有 loader 行才会被 dsh-client-modules 扫进客户端模块表 —— 缺了这一行，UI 不报错、
# 只是永远不出现（dock 里没有「脚本」模块），与 npm-ui / github-ui 同形。
- insert:
    - id: script-client
      name: 'dsh-script-client'

    # 检索词富化（Spec §5.5 / D11）：save 后 fire-and-forget 一次小模型调用，只填空、
    # 不动 updatedAt、不派发客户端事件。平台缺 llm/agentDefaultModel 时整条不激活。
    - id: script-terms
      name: 'dsh-script/terms'
      config:
        enabled: true
        maxTerms: 12
        maxOutputTokens: 256
        timeoutMs: 60000

    - id: script
      name: 'dsh-script'
      config:
        # 目录注入（Spec §5）：指纹去重 + 注入状态 sidecar + per-agent 门控 + 替换帧。
        injection:
          enabled: true
          maxItems: 50
          maxChars: 1200
          catalogDescriptionMaxLength: 200
          # triggers 命中最近工具调用时的主动建议（保留；建议式，不拦截）。
          suggest:
            enabled: true
            maxRecentCalls: 8
            maxChars: 600
