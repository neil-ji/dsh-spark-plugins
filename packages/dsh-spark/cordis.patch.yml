# dsh-spark bundle patch.
# Inserts the host row (registers ctx.spark service).
# 入口退位（2026-09）：spark-ui 行已移除——设置 Modal 的「火花」section 随
# dsh-spark-ui 退役，完整功能由 dsh-spark-dock 悬浮球内嵌。
- insert:
    - id: spark
      name: 'dsh-spark'
      config:
        tombstoneRetentionDays: 30
        # valence 挖掘（Phase 6）：**默认开启**——它属于产品定位（v2 L2「Agent 是
        # 平等的提出者」），不是可选实验；与 commandMining 默认关的理由不同。
        # 四道防线见 valence-service.ts 顶部：D1 只认 source.kind==='user' 的真人话语、
        # D2 长度闸+强度闸作用于同一条话语、D3 provenance 显式标 agent、
        # D4 跨会话实质面去重。这里只暴露阈值旋钮，默认值即上线的值。
        valence:
          enabled: true
          intensityThreshold: 0.4
          maxUtteranceChars: 2000

    # 会话编排层（设计 §5）：把收件箱状态注入会话首步。
    # 在此之前 spark_capture 只写不读 —— 没有这一步，火花面板就是坟场。
    # 三档子能力都挂在同一个 pre-step 入口上（判定逻辑各自是可单测的纯函数）。
    - id: spark-inbox
      name: 'dsh-spark/inbox'
      config:
        enabled: true
        maxChars: 800
        maxItems: 3
        # B 档：脏标记 + 会话首步惰性涌现（**不用定时器** —— AGENTS.md §1.3 禁轮询）。
        reflect:
          enabled: true
          threshold: 3
          minIntervalMs: 300000
        # D 档：命令失败挖掘（模型 × 命令模式 × 错误签名）。**默认关**：
        # 先在沙箱观察一轮产出质量（噪声防线见 command-mining.ts），确认后再开。
        commandMining:
          enabled: false
          minSessions: 2
          maxPitfalls: 3
          maxChars: 600
