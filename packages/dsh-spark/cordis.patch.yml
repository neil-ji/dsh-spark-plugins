# dsh-spark bundle patch.
# Inserts the host row (registers ctx.spark service).
# 入口退位（2026-09）：spark-ui 行已移除——设置 Modal 的「火花」section 随
# dsh-spark-ui 退役，完整功能由 dsh-spark-dock 悬浮球内嵌。
- insert:
    - id: spark
      name: 'dsh-spark'
      config:
        tombstoneRetentionDays: 30

    # 会话编排层（设计 §5）：把收件箱状态注入会话首步。
    # 在此之前 spark_capture 只写不读 —— 没有这一步，火花面板就是坟场。
    - id: spark-inbox
      name: 'dsh-spark/inbox'
      config:
        enabled: true
        maxChars: 800
        maxItems: 3
