# dsh-hippomemo bundle patch.
# Inserted into the active profile after the shipped bundles, so no dsh source file changes.
- insert:
    - id: hippomemo
      name: dsh-hippomemo
      config:
        maxMemories: 10000
        defaultRecallLimit: 5
        maxRecallChars: 8000

    - id: tool-hippomemo
      name: dsh-hippomemo/tool

    - id: hippomemo-context
      name: dsh-hippomemo/context
      config:
        recallLimit: 5
        maxRecallChars: 8000

    # Opt-in by default: each completed turn would otherwise consume an extra
    # auxiliary model call. Enable in the profile patch when wanted.
    - id: hippomemo-extractor
      name: dsh-hippomemo/extractor
      config:
        enabled: false
        maxOutputTokens: 512
        timeoutMs: 60000
        maxCandidatesPerTurn: 4

    # Fire-and-forget keyword enrichment on every memory put (low frequency).
    - id: hippomemo-terms
      name: dsh-hippomemo/terms
      config:
        enabled: true
        maxTerms: 12
        maxOutputTokens: 256
        timeoutMs: 60000

    # Automatic evolution: periodic deterministic hygiene sweeps (expiry,
    # probation for uncited noise, near-duplicate consolidation) plus write-time
    # dedup. Conservative thresholds; every action is reported and reversible.
    - id: hippomemo-evolve
      name: dsh-hippomemo/evolve
      config:
        enabled: true
        intervalMs: 21600000
        dryRun: false
        decayMinRecalls: 5
        graceDays: 3
        probationDays: 30
        dupTitleThreshold: 0.7
        maxConsolidations: 20
        reviewEnabled: true
        reviewProvider: deepseek-official
        reviewModel: deepseek-v4-flash
        reviewMaxTokens: 4096
        reviewTimeoutMs: 60000